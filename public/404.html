<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · LinguaTravel</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
:root{--bg:#F5F6F8;--ink:#0B1220;--muted:#5A6372;--accent:#1D4ED8;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0B1220;--ink:#F2F5FA;--muted:#A4AEC0;--accent:#8DA9FF;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;text-align:center}
h1{font-size:24px;margin:12px 0 6px}
p{color:var(--muted);margin:0 0 16px}
a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div>
  <img src="/logo.svg" alt="" width="48" height="48">
  <h1>Sayfa bulunamadı</h1>
  <p>Aradığın sayfa burada değil.</p>
  <a href="/">LinguaTravel ana sayfası</a>
</div>
</body>
</html>
